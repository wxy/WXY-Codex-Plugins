<style>

y:inline-flex;align-items:center;gap:7px;border-radius:30px;background:#eaf6ef;color:var(--good);padding:6px 12px;font-size:11px;white-space:nowrap}.badge.warn{background:#fff2df;color:var(--warn)}.dot{height:6px;width:6px;background:currentColor;border-radius:50%}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.card,.section{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px}.card{padding:21px 23px}.label{color:var(--muted);font-size:12px}.number{font-size:30px;font-weight:550;letter-spacing:-1px;margin:10px 0 2px;line-height:1.3}.number small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:5px}.caption{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:22px}.section{padding:23px;margin-bottom:22px}.section-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:21px}.link{background:none;border:0;color:var(--accent);font-size:12px;padding:0}.chart{height:190px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}.chart svg{height:100%;width:100%}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.statline{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.statline:last-child{border:0}.statline span{color:var(--muted)}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{color:var(--muted);font-weight:400;border-bottom:1px solid var(--line);padding:0 10px 12px}td{border-bottom:1px solid var(--line);padding:15px 10px;vertical-align:top}tr:last-child td{border:0}td small{display:block;font-size:10px;color:var(--muted);max-width:400px;overflow-wrap:anywhere}.bar{width:90px;background:var(--line);border-radius:4px;height:4px;margin-top:6px}.bar i{display:block;height:100%;border-radius:4px;background:#8b9eea}.positive{color:var(--warn)}.quiet{color:var(--muted)}.empty{color:var(--muted);font-size:12px;padding:23px 6px;line-height:1.9}.notice{background:var(--soft);border-radius:10px;padding:14px 16px;font-size:12px;color:var(--accent);margin-top:18px}.event{padding:15px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event strong{font-weight:500;font-size:12px}.event p,.event small{display:block;color:var(--muted);font-size:11px;margin-top:3px;overflow-wrap:anywhere}.report-day{font-size:22px;letter-spacing:-.5px;margin-bottom:6px}.controls{display:flex;gap:12px;margin-bottom:20px}input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);min-width:0}input{flex:1}.error{color:var(--warn);background:#fff2df;padding:12px;border-radius:8px;margin-bottom:20px;font-size:12px}[hidden]{display:none!important}.footer{color:var(--muted);font-size:10px;margin-top:22px}.update{font-size:10px;color:var(--muted);margin-top:7px;text-align:right}.tabs-content{min-height:300px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:1050px){main{padding:28px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.topbar-inner{padding:16px 16px 0}.local-note{display:none}.nav{margin-top:12px;gap:4px}.nav button{white-space:nowrap;font-size:12px;padding:8px}.nav span,.foot{display:none}main{margin:0;padding:22px 16px}.cards{gap:10px}.card{padding:17px}.number{font-size:25px}header{gap:10px}h1{font-size:23px}.section{padding:17px}.table-wrap{overflow:auto}table{min-width:570px}}@media(prefers-color-scheme:dark){:root{--bg:#171a20;--card:#1d222b;--ink:#e2e8f2;--muted:#929dab;--line:#2b3240;--accent:#a0afff;--soft:#29304b;--good:#92d3b2;--warn:#dfb56e}.badge{background:#20382e}.badge.warn,.error{background:#3d3221}}
.grid>*{min-width:0}.section,.table-wrap,.chart{min-width:0}.table-wrap{max-width:100%}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}.chart-frame{display:grid;grid-template-columns:52px minmax(0,1fr);gap:0}.y-axis{position:relative;height:190px;color:var(--muted);font-size:11px}.y-axis .tick{position:absolute;right:9px;transform:translateY(-50%)}.axis-unit{position:absolute;left:0;top:0;font-size:10px}.chart-labels{margin-left:52px}.chart-summary{font-size:12px;margin-top:14px}.chart-coverage{font-size:10px;color:var(--muted);margin-top:4px}.range{display:flex;gap:3px;flex-wrap:wrap}.range button{border:0;background:none;color:var(--muted);border-radius:6px;font-size:11px;padding:5px 8px}.range button[aria-pressed=true]{background:var(--soft);color:var(--accent)}.chart-heading{align-items:flex-start;flex-wrap:wrap;gap:10px}.event .delivery{margin-top:5px}.gain{color:var(--good)}@media(max-width:480px){header{align-items:flex-start;flex-wrap:wrap}.update{text-align:left}.section-head{gap:9px}.range button{padding:5px 6px}}
</style></head><body>
<div class="topbar"><div class="topbar-inner"><div class="brand-row"><div class="brand"><div class="mark">◉</div><div>Codex Footprint<small>DEVELOPMENT STORAGE</small></div></div><span class="local-note">本机 · 只读面板 · 独立开发者插件</span></div><nav class="nav" aria-label="面板导航"><button data-tab="overview" aria-selected="true"><span>◫</span>概览</button><button data-tab="projects" aria-selected="false"><span>▦</span>项目监控</button><button data-tab="alerts" aria-selected="false"><span>◌</span>增长提醒</button><button data-tab="daily" aria-selected="false"><span>▤</span>每日汇总</button><button data-tab="history" aria-selected="false"><span>◷</span>手动分析记录</button></nav></div></div>
<main><header><div><div class="eyebrow">YOUR DEVELOPMENT FOOTPRINT</div><h1 id="title">空间变化，一目了然</h1><p class="sub" id="subtitle">项目增长在后台观察，全盘分析按需运行。</p></div><div><div class="badge" id="health"><i class="dot"></i><span>连接监控记录…</span></div><div class="update" id="updated"></div></div></header><div id="error" class="error" hidden></div><div class="tabs-content" id="content"></div><p class="footer">目录数字为文件块占用；卷可用空间单独测量。共享缓存与会话关联不代表独占归属。未完整扫描的目录保留未知增长。</p></main>
<script>
'use strict';
let data=null,active='overview',search='',sort='size',range='24h',requestSequence=0;
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(n){if(n==null||!Number.isFinite(n))return '未知';const a=Math.abs(n),u=a>=1e9?'GB':a>=1e6?'MB':'KB',v=a>=1e9?1e9:a>=1e6?1e6:1e3;return (n/v).toFixed(a>=1e9?2:1)+' '+u}
function when(t){return t?new Date(typeof t==='number'?t*1000:t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'尚无记录'}
function name(p){return String(p||'').split('/').filter(Boolean).slice(-1)[0]||p}
function growth(r){return r.growth_bytes==null?'<span class="quiet">待形成可比记录</span>':'<span class="'+(r.growth_bytes>0?'positive':'quiet')+'">'+(r.growth_bytes>0?'+':'')+esc(bytes(r.growth_bytes))+'</span>'}
function card(label,value,note){return '<div class="card"><div class="label">'+label+'</div><div class="number">'+value+'</div><div class="caption">'+note+'</div></div>'}
function rootTable(rows){let max=Math.max(1,...rows.map(r=>r.allocated_bytes||0));return '<div class="table-wrap"><table><thead><tr><th>项目 / 目录</th><th>现存占用</th><th>最近可比变化</th><th>测量时间</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(name(r.path))+'<small>'+esc(r.path)+'</small></td><td>'+(r.complete?'':'≥ ')+esc(bytes(r.allocated_bytes))+'<div class="bar"><i style="width:'+Math.max(1,(r.allocated_bytes||0)/max*100)+'%"></i></div></td><td>'+growth(r)+'<small>'+(r.complete?'完整测量':r.finished?'存在扫描遗漏':'扫描进行中')+(r.baseline_at?' · '+when(r.baseline_at)+' → '+when(r.latest_at):'')+'</small></td><td>'+when(r.measured_at)+'<small>'+(r.started_at&&!r.finished?'开始于 '+when(r.started_at):r.duration_seconds!=null?'本轮 '+Math.round(r.duration_seconds)+' 秒':'')+'</small></td></tr>').join('')+'</tbody></table></div>'}
const kinds={growth:'显著空间增长',rapid_growth:'快速增长',many_files:'大量新文件',large_occupancy:'大占用阈值',sustained_growth:'持续累积',disk_pressure:'磁盘可用空间偏低'};
function delivery(a){const desktop={command_accepted_visibility_unverified:'系统通知已提交，显示待确认',inbox_only:'保留在提醒记录',delivery_failed:'系统通知未送达',unsupported_platform:'系统通知不可用'};const codex=a.acknowledged?'已确认，无需再次提醒':a.codex_delivery?.status==='emitted_to_hook_visibility_unverified'?'已传入活动聊天，显示待确认':'等待活动聊天提醒';return esc(desktop[a.delivery?.status]||'系统通知状态未知')+' · Codex：'+esc(codex)}
function events(rows){return rows.length?rows.map(a=>'<div class="event"><strong>'+esc(kinds[a.kind]||a.kind)+'</strong><p>'+esc(a.path||'本机磁盘')+'</p><small>'+(a.growth_bytes==null?'变化未知':esc(bytes(a.growth_bytes)))+' · '+when(a.latest_at||a.sampled_at||a.ts)+' · '+(a.acknowledged?'已确认':'待查看')+'</small><small class="delivery">'+delivery(a)+'</small></div>').join(''):'<div class="empty">暂无已记录提醒。<br>有新发现时，在活动聊天提示；聊天空闲时由系统通知补充。</div>'}
function rangeControls(){return '<div class="range" role="group" aria-label="磁盘趋势时间范围">'+[['1h','1 小时'],['24h','24 小时'],['7d','7 天']].map(([id,label])=>'<button data-range="'+id+'" aria-pressed="'+(range===id)+'">'+label+'</button>').join('')+'</div>'}
function chart(){
 const volume=(data.volumes||[])[0],a=(data.volume_history||[]).filter(x=>Number.isFinite(x.available_bytes)&&Number.isFinite(x.sampled_at)&&x.device===volume?.device);
 if(data.chart_window?.requested_range!==range)return '<div class="chart">正在读取所选时间范围…</div>';
 if(!a.length)return '<div class="chart">所选时间范围尚无记录</div><p class="chart-coverage">最多保留 7 天；启用前或暂停期间的记录不会补造。</p>';
 const low=Math.min(...a.map(x=>x.available_bytes)),high=Math.max(...a.map(x=>x.available_bytes)),span=Math.max(high-low,1e8),power=10**Math.floor(Math.log10(span/4)),step=[1,2,5,10].find(x=>x*power>=span/4)*power;
 let bottom=Math.floor(low/step)*step,top=Math.ceil(high/step)*step;if(top-bottom<step*2){bottom-=step;top+=step}
 const y=v=>164-(v-bottom)/(top-bottom)*148,first=a[0],last=a[a.length-1],duration=last.sampled_at-first.sampled_at;
 const points=a.map(r=>[(duration?(r.sampled_at-first.sampled_at)/duration:0.5)*600,y(r.available_bytes)]),line=points.map(p=>p.join(',')).join(' '),ticks=[];let grid='';
 for(let v=bottom;v<=top+step*.01;v+=step){ticks.push('<span class="tick" style="top:'+(y(v)/190*100)+'%">'+(v/1e9).toFixed(2)+'</span>');grid+='M0 '+y(v)+' H600 '}
 const delta=last.available_bytes-first.available_bytes,summary=a.length<2?'只有一条采样，区间变化未知':'可用空间'+(delta>=0?'增加 ':'减少 ')+bytes(Math.abs(delta));
 return '<div class="chart-frame"><div class="y-axis" aria-label="纵轴：磁盘可用空间，单位 GB"><span class="axis-unit">GB</span>'+ticks.join('')+'</div><div class="chart"><svg viewBox="0 0 600 190" preserveAspectRatio="none" role="img" aria-label="已记录的磁盘可用空间趋势"><title>'+esc(summary)+'</title><path d="'+grid+'" stroke="var(--line)" fill="none"/>'+(a.length>1?'<polygon points="0,164 '+line+' 600,164" fill="var(--soft)"/><polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>':'<circle cx="300" cy="'+y(first.available_bytes)+'" r="4" fill="var(--accent)"/>')+'</svg></div></div><div class="chart-labels"><span>'+when(first.sampled_at)+'</span><span>'+when(last.sampled_at)+'</span></div><p class="chart-summary '+(delta>=0?'gain':'positive')+'">'+esc(summary)+'<span class="quiet"> · '+esc(bytes(first.available_bytes))+' → '+esc(bytes(last.available_bytes))+'</span></p><p class="chart-coverage">以上为实际记录区间；最多保留 7 天，按分钟汇集。更早或未覆盖的时间没有记录。</p>'
}
function dailyCards(){let rows=data.daily_reports||[];return rows.length?rows.map(r=>'<section class="section"><div class="section-head"><div><div class="report-day">'+esc(r.day)+'</div><p class="sub">更新于 '+when(r.generated_at)+' · '+(r.coverage?.full_day?'覆盖完整报告窗口':'按已覆盖的观察区间汇总')+'</p></div><span class="badge">监控记录汇总</span></div>'+rootTable(r.roots||[])+'<div class="notice">汇总 '+(r.roots||[]).length+' 个目录的独立观察区间。共享目录不相加；未形成端点的增长保持未知。此次未运行全盘分析。</div></section>').join(''):'<section class="section"><h2>每日汇总尚未生成</h2><div class="empty">每天 21:00 汇总后台记录，更新此处并在 Codex 中提醒。<br>首次汇总只展示实际覆盖的时间范围。</div></section>'}
function render(){if(!data)return;let roots=[...(data.roots||[])],alerts=data.alerts||[],reports=data.daily_reports||[],volume=(data.volumes||[])[0],complete=roots.filter(x=>x.complete).length;let html='';const titles={overview:['空间变化，一目了然','项目增长在后台观察，全盘分析按需运行。'],projects:['每个项目，都有记录','查看现存占用、可比变化与测量覆盖。'],alerts:['值得关注的空间变化','已记录的提醒与关联目录，按最近发生时间排列。'],daily:['每天一份空间账本','每天 21:00 更新监控汇总，不启动全盘分析。'],history:['按需分析，保留结论','这里只展示你明确发起的历史占用分析结果。']};$('#title').textContent=titles[active][0];$('#subtitle').textContent=titles[active][1];if(active==='overview'){html='<div class="cards">'+card('磁盘可用空间',esc(bytes(volume?.available_bytes)),'独立的整卷容量测量')+card('观察目录',roots.length+'<small>个</small>',complete+' 个已有完整测量')+card('待查看提醒',alerts.filter(a=>!a.acknowledged).length+'<small>条</small>','仅显示已记录发现')+card('每日汇总',reports.length?esc(reports[0].day.slice(5)):'—','每天 21:00 更新')+'</div><div class="grid"><div><section class="section"><div class="section-head chart-heading"><h2>磁盘可用空间</h2>'+rangeControls()+'</div>'+chart()+'</section><section class="section"><div class="section-head"><h2>当前占用大头</h2><button class="link" data-go="projects">查看全部 →</button></div>'+rootTable(roots.sort((a,b)=>(b.allocated_bytes||0)-(a.allocated_bytes||0)).slice(0,5))+'</section></div><div><section class="section"><div class="section-head"><h2>监控状态</h2><span class="sub">全局</span></div><div class="statline"><span>后台观察器</span>'+ (data.worker?.running?'运行中':'未运行')+'</div><div class="statline"><span>后台心跳</span>'+when(data.worker?.last_tick)+'</div><div class="statline"><span>完整测量</span>'+complete+' / '+roots.length+'</div><div class="statline"><span>监控方式</span>'+(data.worker?.progress?.filesystem_events?.backend==='fsevents'?'macOS 文件变化触发':'定期检查（备用方式）')+'</div><div class="statline"><span>全盘分析</span>仅手动触发</div><div class="notice">目录逐步扫描，更新时间各不相同。较旧或未完整的测量需要结合覆盖状态解读。</div></section><section class="section"><div class="section-head"><h2>最近提醒</h2><button class="link" data-go="alerts">全部 →</button></div>'+events(alerts.slice(0,3))+'</section></div></div>'}else if(active==='projects'){roots=roots.filter(r=>String(r.path).toLowerCase().includes(search.toLowerCase()));roots.sort(sort==='name'?(a,b)=>a.path.localeCompare(b.path):(a,b)=>(b.allocated_bytes||0)-(a.allocated_bytes||0));html='<section class="section"><div class="controls"><input id="search" type="search" aria-label="搜索项目或目录" placeholder="搜索项目或目录" value="'+esc(search)+'"><select id="sort" aria-label="排序"><option value="size" '+(sort==='size'?'selected':'')+'>按占用排序</option><option value="name" '+(sort==='name'?'selected':'')+'>按名称排序</option></select></div>'+rootTable(roots)+'</section>'}else if(active==='alerts'){html='<section class="section"><h2>增长提醒</h2><div class="notice">有新发现时，下一次活动聊天操作会显示 Codex 提示；聊天空闲时由系统通知补充。每天 21:00 另有监控汇总。提示已提交不等于已显示，也不会自动执行清理。</div>'+events(alerts)+'</section>'}else if(active==='daily'){html=dailyCards()}else{let r=data.latest_historical_analysis;html='<section class="section"><h2>最近一次手动分析</h2><div class="notice">以下是当时保存的分析结果；清理后不会自动重做。当前目录占用请查看项目监控。</div>'+(r?'<div class="statline"><span>测量时间</span>'+when(r.measured_at)+'</div><div class="statline"><span>历史增长</span>缺少旧基线时保持未知</div><div class="statline"><span>覆盖状态</span>'+(r.coverage?.complete?'所声明范围已完成':'部分覆盖')+'</div>'+rootTable((r.items||[]).slice(0,20)):'<div class="empty">暂无手动分析记录。<br>在 Codex 会话中明确要求分析当前或历史占用后，结果会保留在这里。</div>')+'</section>'}$('#content').innerHTML=html;document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render();refresh()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>tab(b.dataset.go));let input=$('#search');if(input)input.oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};let select=$('#sort');if(select)select.onchange=e=>{sort=e.target.value;render()};let healthy=data.worker?.running&&!data.worker?.heartbeat_stale;$('#health').classList.toggle('warn',!healthy);$('#health span').text
