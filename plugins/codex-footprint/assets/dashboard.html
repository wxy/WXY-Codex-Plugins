<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Footprint</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--ink:#192539;--muted:#788394;--line:#e9edf2;--accent:#526ee8;--soft:#eef1ff;--good:#23775c;--warn:#a56d20;--shadow:0 4px 22px #233c5b06}*{box-sizing:border-box}body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}aside{width:225px;position:fixed;inset:0 auto 0 0;padding:32px 22px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-weight:650;font-size:16px;letter-spacing:-.4px}.mark{width:35px;height:35px;display:grid;place-items:center;background:var(--soft);color:var(--accent);border-radius:12px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:1.1px;margin-top:-2px}.nav{display:grid;gap:7px;margin-top:42px}.nav button{border:0;background:none;text-align:left;border-radius:10px;padding:11px 13px;color:var(--muted)}.nav button[aria-selected=true]{background:var(--soft);color:var(--accent);font-weight:600}.nav span{display:inline-block;width:25px}.foot{margin-top:auto;color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:18px}.foot strong{display:block;color:var(--ink);font-size:12px;font-weight:500}main{max-width:1450px;margin-left:225px;padding:32px 46px 52px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted)}h1{font-size:27px;letter-spacing:-.8px;font-weight:600;margin:5px 0 6px}h2{font-size:15px;font-weight:600;margin:0}p{margin:0}.sub{color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;gap:7px;border-radius:30px;background:#eaf6ef;color:var(--good);padding:6px 12px;font-size:11px;white-space:nowrap}.badge.warn{background:#fff2df;color:var(--warn)}.dot{height:6px;width:6px;background:currentColor;border-radius:50%}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.card,.section{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px}.card{padding:21px 23px}.label{color:var(--muted);font-size:12px}.number{font-size:30px;font-weight:550;letter-spacing:-1px;margin:10px 0 2px;line-height:1.3}.number small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:5px}.caption{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:22px}.section{padding:23px;margin-bottom:22px}.section-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:21px}.link{background:none;border:0;color:var(--accent);font-size:12px;padding:0}.chart{height:160px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}.chart svg{height:100%;width:100%}.chart-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.statline{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.statline:last-child{border:0}.statline span{color:var(--muted)}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{color:var(--muted);font-weight:400;border-bottom:1px solid var(--line);padding:0 10px 12px}td{border-bottom:1px solid var(--line);padding:15px 10px;vertical-align:top}tr:last-child td{border:0}td small{display:block;font-size:10px;color:var(--muted);max-width:400px;overflow-wrap:anywhere}.bar{width:90px;background:var(--line);border-radius:4px;height:4px;margin-top:6px}.bar i{display:block;height:100%;border-radius:4px;background:#8b9eea}.positive{color:var(--warn)}.quiet{color:var(--muted)}.empty{color:var(--muted);font-size:12px;padding:23px 6px;line-height:1.9}.notice{background:var(--soft);border-radius:10px;padding:14px 16px;font-size:12px;color:var(--accent);margin-top:18px}.event{padding:15px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event strong{font-weight:500;font-size:12px}.event p,.event small{display:block;color:var(--muted);font-size:11px;margin-top:3px;overflow-wrap:anywhere}.report-day{font-size:22px;letter-spacing:-.5px;margin-bottom:6px}.controls{display:flex;gap:12px;margin-bottom:20px}input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);min-width:0}input{flex:1}.error{color:var(--warn);background:#fff2df;padding:12px;border-radius:8px;margin-bottom:20px;font-size:12px}[hidden]{display:none!important}.footer{color:var(--muted);font-size:10px;margin-top:22px}.update{font-size:10px;color:var(--muted);margin-top:7px;text-align:right}.tabs-content{min-height:300px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:1050px){main{padding:28px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){aside{position:static;width:100%;padding:16px;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto;margin-top:16px;gap:4px}.nav button{white-space:nowrap;font-size:12px;padding:8px}.nav span,.foot{display:none}main{margin:0;padding:22px 16px}.cards{gap:10px}.card{padding:17px}.number{font-size:25px}header{gap:10px}h1{font-size:23px}.section{padding:17px}.table-wrap{overflow:auto}table{min-width:570px}}@media(prefers-color-scheme:dark){:root{--bg:#171a20;--card:#1d222b;--ink:#e2e8f2;--muted:#929dab;--line:#2b3240;--accent:#a0afff;--soft:#29304b;--good:#92d3b2;--warn:#dfb56e}.badge{background:#20382e}.badge.warn,.error{background:#3d3221}}
</style></head><body>
<aside><div class="brand"><div class="mark">◉</div><div>Codex Footprint<small>DEVELOPMENT STORAGE</small></div></div><nav class="nav" aria-label="面板导航"><button data-tab="overview" aria-selected="true"><span>◫</span>概览</button><button data-tab="projects" aria-selected="false"><span>▦</span>项目监控</button><button data-tab="alerts" aria-selected="false"><span>◌</span>增长提醒</button><button data-tab="daily" aria-selected="false"><span>▤</span>每日汇总</button><button data-tab="history" aria-selected="false"><span>◷</span>手动分析记录</button></nav><div class="foot"><strong>本机 · 只读面板</strong>独立开发者插件<br>观察、解释与建议</div></aside>
<main><header><div><div class="eyebrow">YOUR DEVELOPMENT FOOTPRINT</div><h1 id="title">空间变化，一目了然</h1><p class="sub" id="subtitle">项目增长在后台观察，全盘分析按需运行。</p></div><div><div class="badge" id="health"><i class="dot"></i><span>连接监控记录…</span></div><div class="update" id="updated"></div></div></header><div id="error" class="error" hidden></div><div class="tabs-content" id="content"></div><p class="footer">目录数字为文件块占用；卷可用空间单独测量。共享缓存与会话关联不代表独占归属。未完整扫描的目录保留未知增长。</p></main>
<script>
'use strict';
let data=null,active='overview',search='',sort='size';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(n){if(n==null||!Number.isFinite(n))return '未知';const a=Math.abs(n),u=a>=1e9?'GB':a>=1e6?'MB':'KB',v=a>=1e9?1e9:a>=1e6?1e6:1e3;return (n/v).toFixed(a>=1e9?2:1)+' '+u}
function when(t){return t?new Date(typeof t==='number'?t*1000:t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'尚无记录'}
function name(p){return String(p||'').split('/').filter(Boolean).slice(-1)[0]||p}
function growth(r){return r.growth_bytes==null?'<span class="quiet">待形成可比记录</span>':'<span class="'+(r.growth_bytes>0?'positive':'quiet')+'">'+(r.growth_bytes>0?'+':'')+esc(bytes(r.growth_bytes))+'</span>'}
function card(label,value,note){return '<div class="card"><div class="label">'+label+'</div><div class="number">'+value+'</div><div class="caption">'+note+'</div></div>'}
function rootTable(rows){let max=Math.max(1,...rows.map(r=>r.allocated_bytes||0));return '<div class="table-wrap"><table><thead><tr><th>项目 / 目录</th><th>现存占用</th><th>最近可比变化</th><th>测量时间</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(name(r.path))+'<small>'+esc(r.path)+'</small></td><td>'+(r.complete?'':'≥ ')+esc(bytes(r.allocated_bytes))+'<div class="bar"><i style="width:'+Math.max(1,(r.allocated_bytes||0)/max*100)+'%"></i></div></td><td>'+growth(r)+'<small>'+(r.complete?'完整测量':r.finished?'存在扫描遗漏':'扫描进行中')+(r.baseline_at?' · '+when(r.baseline_at)+' → '+when(r.latest_at):'')+'</small></td><td>'+when(r.measured_at)+'<small>'+(r.started_at&&!r.finished?'开始于 '+when(r.started_at):r.duration_seconds!=null?'本轮 '+Math.round(r.duration_seconds)+' 秒':'')+'</small></td></tr>').join('')+'</tbody></table></div>'}
const kinds={growth:'显著空间增长',rapid_growth:'快速增长',many_files:'大量新文件',large_occupancy:'大占用阈值',sustained_growth:'持续累积',disk_pressure:'磁盘可用空间偏低'};
function events(rows){return rows.length?rows.map(a=>'<div class="event"><strong>'+esc(kinds[a.kind]||a.kind)+'</strong><p>'+esc(a.path||'本机磁盘')+'</p><small>'+(a.growth_bytes==null?'变化未知':esc(bytes(a.growth_bytes)))+' · '+when(a.latest_at||a.sampled_at||a.ts)+' · '+(a.acknowledged?'已确认':'待查看')+'</small></div>').join(''):'<div class="empty">暂无已记录提醒。<br>扫描进度与覆盖范围见监控状态。</div>'}
function chart(){let a=(data.volume_history||[]).filter(x=>Number.isFinite(x.available_bytes)&&x.device===(data.volumes||[])[0]?.device);if(a.length<2)return '<div class="chart">形成更多记录后显示可用空间趋势</div>';a=a.slice(-120);let low=Math.min(...a.map(x=>x.available_bytes)),high=Math.max(...a.map(x=>x.available_bytes)),span=Math.max(high-low,1e8);let points=a.map((x,i)=>[i/(a.length-1)*600,130-(x.available_bytes-low)/span*100]);let line=points.map(p=>p.join(',')).join(' ');return '<div class="chart"><svg viewBox="0 0 600 160" role="img" aria-label="已记录的磁盘可用空间趋势"><path d="M0 145 H600 M0 95 H600 M0 45 H600" stroke="var(--line)" fill="none"/><polygon points="0,145 '+line+' 600,145" fill="var(--soft)"/><polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/></svg></div><div class="chart-labels"><span>'+when(a[0].sampled_at)+'</span><span>'+when(a[a.length-1].sampled_at)+'</span></div>'}
function dailyCards(){let rows=data.daily_reports||[];return rows.length?rows.map(r=>'<section class="section"><div class="section-head"><div><div class="report-day">'+esc(r.day)+'</div><p class="sub">更新于 '+when(r.generated_at)+' · '+(r.coverage?.full_day?'覆盖完整报告窗口':'按已覆盖的观察区间汇总')+'</p></div><span class="badge">监控记录汇总</span></div>'+rootTable(r.roots||[])+'<div class="notice">汇总 '+(r.roots||[]).length+' 个目录的独立观察区间。共享目录不相加；未形成端点的增长保持未知。此次未运行全盘分析。</div></section>').join(''):'<section class="section"><h2>每日汇总尚未生成</h2><div class="empty">每天 21:00 汇总后台记录，更新此处并在 Codex 中提醒。<br>首次汇总只展示实际覆盖的时间范围。</div></section>'}
function render(){if(!data)return;let roots=[...(data.roots||[])],alerts=data.alerts||[],reports=data.daily_reports||[],volume=(data.volumes||[])[0],complete=roots.filter(x=>x.complete).length;let html='';const titles={overview:['空间变化，一目了然','项目增长在后台观察，全盘分析按需运行。'],projects:['每个项目，都有记录','查看现存占用、可比变化与测量覆盖。'],alerts:['值得关注的空间变化','已记录的提醒与关联目录，按最近发生时间排列。'],daily:['每天一份空间账本','每天 21:00 更新监控汇总，不启动全盘分析。'],history:['按需分析，保留结论','这里只展示你明确发起的历史占用分析结果。']};$('#title').textContent=titles[active][0];$('#subtitle').textContent=titles[active][1];if(active==='overview'){html='<div class="cards">'+card('磁盘可用空间',esc(bytes(volume?.available_bytes)),'独立的整卷容量测量')+card('观察目录',roots.length+'<small>个</small>',complete+' 个已有完整测量')+card('待查看提醒',alerts.filter(a=>!a.acknowledged).length+'<small>条</small>','仅显示已记录发现')+card('每日汇总',reports.length?esc(reports[0].day.slice(5)):'—','每天 21:00 更新')+'</div><div class="grid"><div><section class="section"><div class="section-head"><h2>磁盘可用空间</h2><span class="sub">最近记录</span></div>'+chart()+'</section><section class="section"><div class="section-head"><h2>当前占用大头</h2><button class="link" data-go="projects">查看全部 →</button></div>'+rootTable(roots.sort((a,b)=>(b.allocated_bytes||0)-(a.allocated_bytes||0)).slice(0,5))+'</section></div><div><section class="section"><div class="section-head"><h2>监控状态</h2><span class="sub">全局</span></div><div class="statline"><span>后台观察器</span>'+ (data.worker?.running?'运行中':'未运行')+'</div><div class="statline"><span>后台心跳</span>'+when(data.worker?.last_tick)+'</div><div class="statline"><span>完整测量</span>'+complete+' / '+roots.length+'</div><div class="statline"><span>全盘分析</span>仅手动触发</div><div class="notice">目录逐步扫描，更新时间各不相同。较旧或未完整的测量需要结合覆盖状态解读。</div></section><section class="section"><div class="section-head"><h2>最近提醒</h2><button class="link" data-go="alerts">全部 →</button></div>'+events(alerts.slice(0,3))+'</section></div></div>'}else if(active==='projects'){roots=roots.filter(r=>String(r.path).toLowerCase().includes(search.toLowerCase()));roots.sort(sort==='name'?(a,b)=>a.path.localeCompare(b.path):(a,b)=>(b.allocated_bytes||0)-(a.allocated_bytes||0));html='<section class="section"><div class="controls"><input id="search" type="search" aria-label="搜索项目或目录" placeholder="搜索项目或目录" value="'+esc(search)+'"><select id="sort" aria-label="排序"><option value="size" '+(sort==='size'?'selected':'')+'>按占用排序</option><option value="name" '+(sort==='name'?'selected':'')+'>按名称排序</option></select></div>'+rootTable(roots)+'</section>'}else if(active==='alerts'){html='<section class="section"><h2>增长提醒</h2>'+events(alerts)+'</section>'}else if(active==='daily'){html=dailyCards()}else{let r=data.latest_historical_analysis;html='<section class="section"><h2>最近一次手动分析</h2><div class="notice">以下是当时保存的分析结果；清理后不会自动重做。当前目录占用请查看项目监控。</div>'+(r?'<div class="statline"><span>测量时间</span>'+when(r.measured_at)+'</div><div class="statline"><span>历史增长</span>缺少旧基线时保持未知</div><div class="statline"><span>覆盖状态</span>'+(r.coverage?.complete?'所声明范围已完成':'部分覆盖')+'</div>'+rootTable((r.items||[]).slice(0,20)):'<div class="empty">暂无手动分析记录。<br>在 Codex 会话中明确要求分析当前或历史占用后，结果会保留在这里。</div>')+'</section>'}$('#content').innerHTML=html;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>tab(b.dataset.go));let input=$('#search');if(input)input.oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};let select=$('#sort');if(select)select.onchange=e=>{sort=e.target.value;render()};let healthy=data.worker?.running&&!data.worker?.heartbeat_stale;$('#health').classList.toggle('warn',!healthy);$('#health span').textContent=healthy?'后台监控中':'监控需要关注';$('#updated').textContent='面板刷新 '+when(data.generated_at)}
function tab(t){active=t;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
async function refresh(){try{const r=await fetch('/api/dashboard',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();$('#error').hidden=true;render()}catch(e){$('#error').hidden=false;$('#error').textContent='暂时无法读取监控记录。保留当前显示，稍后自动重试。';$('#health').classList.add('warn');$('#health span').textContent='连接暂不可用'}}
refresh();setInterval(refresh,15000);
</script></body></html>
