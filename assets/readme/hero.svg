  <text x="68" y="261" fill="#6B6255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Turn daily work into reusable Codex capabilities.</text>
  <text x="68" y="315" fill="#6B6255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="16">One repository · independent plugins · local-first workflows</text>
