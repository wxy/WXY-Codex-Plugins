<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">WXY Codex Plugins</title>
  <desc id="desc">A bilingual hero with connected plugin cards and a daydream poster motif.</desc>
